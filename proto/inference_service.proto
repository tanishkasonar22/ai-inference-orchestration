syntax = "proto3";
package inference.v1;

import "model_config.proto";

// Control-plane API for deploying inference engines onto KServe.
//
// Merge note: package + RPC style from Tanishka's original. Changes: enum now
// covers TWO heterogeneous engines (the >=2-engine constraint), status is
// acceptance-shaped for KServe's async reconcile (ACCEPTED != serving), and
// the Configure/GetStatus/Delete RPCs are added.
service InferenceEngineService {
  // REQ-1.1: deploy a supported engine into the cluster.
  rpc DeployInferenceEngine(DeployInferenceEngineRequest)
      returns (DeployInferenceEngineResponse);

  // Runtime reconfiguration without delete+recreate (REQ-2.2 / Objective 2).
  rpc ConfigureModel(ConfigureModelRequest)
      returns (ConfigureModelResponse);

  // Query async reconcile / serving state.
  rpc GetDeploymentStatus(GetDeploymentStatusRequest)
      returns (GetDeploymentStatusResponse);

  // Tear down a deployment.
  rpc DeleteDeployment(DeleteDeploymentRequest)
      returns (DeleteDeploymentResponse);
}

// Supported engine types (REQ-1.1). >=2 heterogeneous engines is a launch
// constraint, so both are first-class. UNSPECIFIED is rejected at validation.
// Note: in KServe there is no runtime literally named "vllm" — vLLM is the
// backend of the HuggingFace runtime, hence VLLM_HUGGINGFACE.
enum EngineType {
  ENGINE_TYPE_UNSPECIFIED = 0;
  ENGINE_TYPE_VLLM_HUGGINGFACE = 1;  // KServe HuggingFace runtime (vLLM backend)
  ENGINE_TYPE_TRITON = 2;            // KServe Triton runtime
}

// Async status. ACCEPTED = CR applied and passed admission, NOT serving.
// READY (serving) is a later reconcile state, surfaced via GetDeploymentStatus.
enum DeploymentStatus {
  DEPLOYMENT_STATUS_UNSPECIFIED = 0;
  DEPLOYMENT_STATUS_ACCEPTED = 1;   // CR applied; reconcile in progress
  DEPLOYMENT_STATUS_REJECTED = 2;   // validation failed (bad engine/config)
  DEPLOYMENT_STATUS_FAILED = 3;     // apply failed (RBAC, API error)
  DEPLOYMENT_STATUS_READY = 4;      // predictor Running and serving
  DEPLOYMENT_STATUS_NOT_FOUND = 5;  // queried a name that isn't deployed
}

message DeployInferenceEngineRequest {
  EngineType engine_type = 1;      // which engine to deploy
  string cluster_ref = 2;          // target cluster; empty = local (forward hook)
  ModelConfig model_config = 3;    // standard model configuration
}
message DeployInferenceEngineResponse {
  string deployment_id = 1;        // echoes model_config.model_id
  DeploymentStatus status = 2;     // ACCEPTED / REJECTED / FAILED
  string message = 3;              // human-readable detail
}

// Patch in place (no delete+recreate). NOTE: pod-template changes (args,
// resources) still roll the predictor pods; only replica changes leave running
// pods untouched. Changing engine_type is breaking -> rejected.
message ConfigureModelRequest {
  string deployment_id = 1;
  string namespace = 2;
  ModelConfig model_config = 3;    // desired state; service reconciles the diff
}
message ConfigureModelResponse {
  string deployment_id = 1;
  DeploymentStatus status = 2;
  string message = 3;
}

message GetDeploymentStatusRequest {
  string deployment_id = 1;
  string namespace = 2;
}
message GetDeploymentStatusResponse {
  string deployment_id = 1;
  DeploymentStatus status = 2;     // READY / ACCEPTED / FAILED / NOT_FOUND
  string message = 3;
  string url = 4;                  // in-cluster predictor URL when READY
}

message DeleteDeploymentRequest {
  string deployment_id = 1;
  string namespace = 2;
}
message DeleteDeploymentResponse {
  string deployment_id = 1;
  bool deleted = 2;
  string message = 3;
}
