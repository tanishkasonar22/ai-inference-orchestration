apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "inference-control-plane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "inference-control-plane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "inference-control-plane.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "inference-control-plane.serviceAccountName" . }}
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: 50051
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
