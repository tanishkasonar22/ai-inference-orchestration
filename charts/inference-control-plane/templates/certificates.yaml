{{- if .Values.tls.enabled }}
# mTLS for the gRPC API (:50051). Self-signed CA -> CA issuer -> server +
# client certs, all via cert-manager (already a cluster prerequisite).
# The server requires a valid client cert to open a connection at all -- this
# covers all four RPCs at the transport layer, no per-RPC auth check needed.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-selfsigned
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: {{ include "inference-control-plane.fullname" . }}-ca
  secretName: {{ .Values.tls.caSecretName }}
  issuerRef:
    name: {{ include "inference-control-plane.fullname" . }}-selfsigned
    kind: Issuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-ca-issuer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  ca:
    secretName: {{ .Values.tls.caSecretName }}
---
# Server cert -- SANs cover every form of the in-cluster Service DNS name.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-server
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.serverSecretName }}
  issuerRef:
    name: {{ include "inference-control-plane.fullname" . }}-ca-issuer
    kind: Issuer
  dnsNames:
    - {{ include "inference-control-plane.fullname" . }}
    - {{ include "inference-control-plane.fullname" . }}.{{ .Release.Namespace }}
    - {{ include "inference-control-plane.fullname" . }}.{{ .Release.Namespace }}.svc
    - {{ include "inference-control-plane.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local
---
# Client cert for callers (client.py / future automation). See NOTES.txt for
# the full extraction commands (bash + PowerShell) -- save into client-certs/
# (git-ignored) and point TLS_CERT_DIR there.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "inference-control-plane.fullname" . }}-client
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  secretName: {{ .Values.tls.clientSecretName }}
  issuerRef:
    name: {{ include "inference-control-plane.fullname" . }}-ca-issuer
    kind: Issuer
  commonName: {{ include "inference-control-plane.fullname" . }}-client
{{- end }}
