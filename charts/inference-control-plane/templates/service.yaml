apiVersion: v1
kind: Service
metadata:
  name: {{ include "inference-control-plane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "inference-control-plane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: grpc
      protocol: TCP
      name: grpc
  selector:
    {{- include "inference-control-plane.selectorLabels" . | nindent 4 }}
