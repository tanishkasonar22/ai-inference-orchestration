{{- if .Values.rbac.create }}
{{- $root := . }}
{{- $namespaces := .Values.watchNamespaces }}
{{- if not $namespaces }}
{{- $namespaces = list .Release.Namespace }}
{{- end }}
{{- range $ns := $namespaces }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "inference-control-plane.fullname" $root }}-inferenceservices
  namespace: {{ $ns }}
  labels:
    {{- include "inference-control-plane.labels" $root | nindent 4 }}
rules:
  - apiGroups: ["serving.kserve.io"]
    resources: ["inferenceservices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "inference-control-plane.fullname" $root }}-inferenceservices
  namespace: {{ $ns }}
  labels:
    {{- include "inference-control-plane.labels" $root | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "inference-control-plane.serviceAccountName" $root }}
    namespace: {{ $root.Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "inference-control-plane.fullname" $root }}-inferenceservices
  apiGroup: rbac.authorization.k8s.io
---
{{- end }}
{{- end }}
